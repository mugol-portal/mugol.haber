        <div style="background:#1a2340; border-radius:20px; width:100%; max-width:480px; box-shadow:0 24px 60px rgba(0,0,0,0.7); overflow:hidden; position:relative;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:#111827; border-bottom:1px solid rgba(255,255,255,0.08);">
                <div style="display:flex; align-items:center; gap:10px;">
                    <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1e40af,#3b82f6);display:flex;align-items:center;justify-content:center;">
                        <i class="fas fa-image" style="color:white;font-size:0.85rem;"></i>
                    </div>
                    <div>
                        <div style="color:white;font-family:Nunito,sans-serif;font-weight:800;font-size:1rem;">Görsel Önizleme</div>
                        <div style="color:rgba(255,255,255,0.45);font-size:0.72rem;">İndirmeden önce düzenleyin</div>
                    </div>
                </div>
                <button onclick="closeImagePreviewModal()" style="width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);color:white;cursor:pointer;font-size:1rem; display:flex;align-items:center;justify-content:center;">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div style="padding:16px 20px 0; position:relative;">
                <div style="border-radius:14px; overflow:hidden; background:#0a0f1e; box-shadow:0 8px 24px rgba(0,0,0,0.5); position:relative; max-height: 50vh; overflow-y: auto;">
                    <canvas id="previewCanvas" style="width:100%; display:block; border-radius:14px;"></canvas>
                    <div id="previewLoadingOverlay" style="display:none; position:absolute;inset:0;background:rgba(10,15,30,0.8);align-items:center;justify-content:center;border-radius:14px;">
                        <div style="text-align:center;">
                            <div style="width:36px;height:36px;border-radius:50%;border:3px solid rgba(59,130,246,0.3);border-top-color:#3b82f6;animation:spin 0.8s linear infinite;margin:0 auto 8px;"></div>
                            <div style="color:rgba(255,255,255,0.6);font-size:0.8rem;">Hazırlanıyor...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div style="padding:14px 20px 6px;">
                <div style="color:rgba(255,255,255,0.6);font-size:0.75rem;font-family:Nunito,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;">
                    <i class="fas fa-palette" style="color:#3b82f6;margin-right:6px;"></i>Arka Plan Rengi
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                    <div style="display:flex;gap:8px;flex-wrap:wrap;flex:1;">
                        <button class="clr-swatch" data-color="#0c1a3a" style="background:#0c1a3a;" onclick="pickPreviewColor('#0c1a3a',this)" title="Lacivert"></button>
                        <button class="clr-swatch" data-color="#111827" style="background:#111827;" onclick="pickPreviewColor('#111827',this)" title="Antrasit"></button>
                        <button class="clr-swatch" data-color="#7f1d1d" style="background:#7f1d1d;" onclick="pickPreviewColor('#7f1d1d',this)" title="Bordo"></button>
                        <button class="clr-swatch" data-color="#064e3b" style="background:#064e3b;" onclick="pickPreviewColor('#064e3b',this)" title="Koyu Yeşil"></button>
                        <button class="clr-swatch" data-color="#1e1b4b" style="background:#1e1b4b;" onclick="pickPreviewColor('#1e1b4b',this)" title="Koyu Mor"></button>
                        <button class="clr-swatch" data-color="#431407" style="background:#431407;" onclick="pickPreviewColor('#431407',this)" title="Kahve"></button>
                        <button class="clr-swatch" data-color="#0f172a" style="background:#0f172a;" onclick="pickPreviewColor('#0f172a',this)" title="Siyah"></button>
                        <button class="clr-swatch" data-color="#1c3d5a" style="background:#1c3d5a;" onclick="pickPreviewColor('#1c3d5a',this)" title="Çelik Mavisi"></button>
                    </div>
                    <label style="position:relative;cursor:pointer;flex-shrink:0;" title="Özel renk seç">
                        <input type="color" id="bgColorPicker" value="#0c1a3a" 
                               style="position:absolute;opacity:0;width:0;height:0;" 
                               onchange="onColorPickerChange(this.value)">
                        <div style="width:38px;height:38px;border-radius:10px;border:2px solid rgba(255,255,255,0.2);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);display:flex;align-items:center;justify-content:center;transition:0.2s;">
                            <i class="fas fa-eyedropper" style="color:white;font-size:0.85rem;text-shadow:0 1px 3px rgba(0,0,0,0.8);"></i>
                        </div>
                    </label>
                </div>
            </div>

            <div style="padding:14px 20px 20px; display:flex; gap:10px;">
                <button onclick="closeImagePreviewModal()" 
                        style="flex:1;height:48px;border-radius:12px;border:2px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);font-family:Nunito,sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;transition:0.2s;">
                    <i class="fas fa-times" style="margin-right:6px;"></i>Kapat
                </button>
                <button onclick="downloadFromPreview()" 
                        style="flex:2;height:48px;border-radius:12px;border:none;background:linear-gradient(135deg,#1e40af,#3b82f6);color:white;font-family:Nunito,sans-serif;font-weight:800;font-size:0.95rem;cursor:pointer;transition:0.2s;box-shadow:0 4px 16px rgba(30,64,175,0.4);">
                    <i class="fas fa-download" style="margin-right:8px;"></i>İndir
                </button>
            </div>
        </div>
    </div>

    <style>
    .clr-swatch { width:38px;height:38px;border-radius:10px; border:2px solid rgba(255,255,255,0.15); cursor:pointer;transition:0.2s;flex-shrink:0; }
    .clr-swatch:hover { transform:scale(1.1); border-color:rgba(255,255,255,0.5); }
    .clr-swatch.active { border-color:#3b82f6 !important; box-shadow:0 0 0 3px rgba(59,130,246,0.4); }
    @keyframes spin { to { transform:rotate(360deg); } }
    </style>
    <script>
    function pickPreviewColor(color, el) {
        document.getElementById('bgColorPicker').value = color;
        document.querySelectorAll('.clr-swatch').forEach(b => b.classList.remove('active'));
        el.classList.add('active'); showPreviewLoading(); renderPreviewCanvas();
    }
    function onColorPickerChange(color) {
        document.querySelectorAll('.clr-swatch').forEach(b => b.classList.remove('active'));
        showPreviewLoading(); renderPreviewCanvas();
    }
    function showPreviewLoading() {
        const ov = document.getElementById('previewLoadingOverlay');
        if(ov) { ov.style.display='flex'; setTimeout(()=>{ ov.style.display='none'; },1500); }
    }
    document.addEventListener('DOMContentLoaded', ()=>{
        const first = document.querySelector('.clr-swatch[data-color="#0c1a3a"]');
        if(first) first.classList.add('active');
    });
    </script>
</body>
</html>
